<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tempo Angola | Previsão do tempo</title>
  <meta name="description" content="Pesquise uma cidade angolana e veja o clima atual e a previsão para 7 dias." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-theme="day">
  <main class="app">
    <h1>⛅ Tempo Angola</h1>
    <p class="sub">Clima atual e previsão para 7 dias nas cidades de Angola.</p>

    <form id="form" class="search" role="search">
      <label class="sr" for="q">Nome da cidade</label>
      <input id="q" type="search" placeholder="Ex.: Luanda, Huambo, Lubango…" autocomplete="off" required />
      <button class="btn" type="submit">Pesquisar</button>
      <button class="btn ghost" type="button" id="geo" title="Usar a minha localização">📍</button>
    </form>
    <div class="chips" id="chips" aria-label="Cidades rápidas"></div>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="current" class="card" hidden>
      <h2 id="place"></h2>
      <div class="now">
        <span class="icon" id="icon" aria-hidden="true"></span>
        <span class="temp" id="temp"></span>
      </div>
      <p class="desc" id="desc"></p>
      <ul class="details">
        <li>Sensação <strong id="feels"></strong></li>
        <li>Humidade <strong id="hum"></strong></li>
        <li>Vento <strong id="wind"></strong></li>
      </ul>
    </section>

    <section id="forecastBox" hidden>
      <h2 class="sec">Próximos 7 dias</h2>
      <div class="forecast" id="forecast"></div>
    </section>

    <footer>Dados: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> · Projeto de estudo</footer>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
